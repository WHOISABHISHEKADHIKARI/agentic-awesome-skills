name: Draft Community Showcase

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: showcase-draft
  cancel-in-progress: false

jobs:
  draft-showcase:
    if: ${{ github.event.label.name == 'showcase-submission' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (trusted scripts and template)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "lts/*"

      - name: Draft showcase pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/scripts/draft_community_showcase.js \
            --org "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --token "$GH_TOKEN" \
            --next