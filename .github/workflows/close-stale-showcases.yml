name: Close Stale Showcase PRs

on:
  schedule:
    - cron: "42 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: showcase-stale
  cancel-in-progress: false

jobs:
  close-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close untouched rejected showcases after 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff_epoch="$(date -u -d '14 days ago' +%s)"

          pr_list="$(gh pr list --repo "${{ github.repository }}" \
            --state open \
            --label showcase-reject \
            --limit 100 \
            --json number,updatedAt,createdAt --jq '.[] | [.number, (.updatedAt)] | @tsv')"

          [ -n "$pr_list" ] || { echo "no rejected showcases to evaluate"; exit 0; }

          while IFS=$'\t' read -r number updated_at; do
            updated_epoch="$(date -u -d "$updated_at" +%s 2>/dev/null || echo 0)"
            if [ "$updated_epoch" -lt "$cutoff_epoch" ]; then
              gh pr edit "$number" --repo "${{ github.repository }}" --add-label showcase-stale >/dev/null || true
              gh pr comment "$number" --repo "${{ github.repository }}" \
                --body "**Closed as stale.** This rejected showcase had no activity in 14 days. Reopen or update it to resubmit." \
                || true
              gh pr close "$number" --repo "${{ github.repository }}" --comment "Closed by the stale showcase cleanup." || true
              echo "closed stale rejected showcase PR #$number"
            fi
          done <<< "$pr_list"