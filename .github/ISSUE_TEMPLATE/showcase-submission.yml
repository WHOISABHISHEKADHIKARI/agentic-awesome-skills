name: Showcase submission
description: Share a written creation (skill, guide, tutorial, template, workflow, integration) that showcases this community. Authorship proof is required and machine-verified against your GitHub account.
title: "Showcase: <short title of your written creation>"
labels:
  - showcase-submission
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## About this form

        This community is promoted by its contributors sharing their best
        **written** creations — skills, guides, tutorials, templates, workflows,
        and integrations. Attendance and speaking at events is not the goal here.

        Provenance is the main concern of this pipeline:

        - Your GitHub account is the author. Your handle is locked to your account and cannot be edited.
        - At least one **proof link** is required so authorship can be verified.
        - GitHub-hosted proof links (a repo you own, a PR you authored, a commit you authored) are
          machine-checked against your handle.
        - Anything unverifiable is reviewed by a maintainer before it is accepted.

        A bot drafts a pull request from your answers. You do not need to know Git.
  - type: input
    id: showcase_title
    attributes:
      label: Showcase title
      description: Title of your written creation (8–120 characters).
      placeholder: "google-no-code: automating Google Forms with Apps Script"
    validations:
      required: true
  - type: input
    id: publish_date
    attributes:
      label: Publication date
      description: When the content was written, in YYYY-MM-DD.
      placeholder: "2026-09-19"
    validations:
      required: true
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  - type: dropdown
    id: showcase_type
    attributes:
      label: Showcase type
      description: Written creations only.
      multiple: false
      options:
        - skill
        - tutorial
        - guide
        - article
        - template
        - workflow
        - integration
        - bundle
        - other
    validations:
      required: true
  - type: textarea
    id: showcase_summary
    attributes:
      label: Showcase summary
      description: 2–4 sentences (100–1200 characters) — what you made, who it helps, and how it showcases this community.
      placeholder: "I wrote a complete skill that walks a user from designing a Google Form through wiring Apps Script onFormSubmit triggers for email alerts and spreadsheet logging, with no prior scripting experience required."
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Proof of authorship

        At least **one** proof link is required. GitHub-hosted links are verified
        against your GitHub handle. Non-GitHub links (a published article, for
        example) are resolved and reviewed by a maintainer.
  - type: input
    id: proof_repo
    attributes:
      label: "Proof: repository (recommended)"
      description: A GitHub repository you authored.
      placeholder: "https://github.com/<your-handle>/<repo>"
    validations:
      required: false
  - type: input
    id: proof_pull_request
    attributes:
      label: "Proof: pull request"
      description: A GitHub pull request you authored.
      placeholder: "https://github.com/<owner>/<repo>/pull/<number>"
    validations:
      required: false
  - type: input
    id: proof_commit
    attributes:
      label: "Proof: commit"
      description: A GitHub commit you authored.
      placeholder: "https://github.com/<owner>/<repo>/commit/<sha>"
    validations:
      required: false
  - type: input
    id: published_url
    attributes:
      label: Published URL (non-GitHub only)
      description: A published article or page you wrote. Reviewed by a maintainer for authorship.
      placeholder: "https://example.com/my-article"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## Context
  - type: input
    id: related_skills
    attributes:
      label: Related community skills
      description: Comma-separated skill IDs from this repository that your creation uses or showcases (for example `google-no-code`).
      placeholder: "google-no-code"
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional lowercase tags, comma-separated (max 6).
      placeholder: "google, forms, apps-script"
    validations:
      required: false
  - type: input
    id: author_name
    attributes:
      label: Your name (optional)
      description: Display name used in the showcase. Your GitHub handle is always locked to your account regardless.
      placeholder: "Abhishek Adhikari"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        By submitting, you confirm this content is your own written work and that
        you grant this repository the right to publish it under the repository
        license. Verify the URL above starts with `https://github.com` before
        submitting. Your handle is verified; links that cannot be verified are
        reviewed manually.